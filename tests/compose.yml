# Lokalny WordPress do testów: docker compose -f tests/compose.yml -p dxp up -d, potem wp przez usługę cli.
# Menedżer Strony AI z sąsiedniego katalogu: test konektora (popup.update, plugin.install) i zgodności z 2.8.0.
services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: local-fixture-only
      MARIADB_ROOT_PASSWORD: local-root-fixture-only
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 2s
      timeout: 2s
      retries: 30
  wordpress:
    image: wordpress:php8.4-apache
    ports:
      - 127.0.0.1:8098:80
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: local-fixture-only
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - wordpress:/var/www/html
      - ..:/var/www/html/wp-content/plugins/digital-xperts-popup:ro
      - ../../menedzer-strony-ai:/var/www/html/wp-content/plugins/ai-site-manager:ro
  cli:
    image: wordpress:cli-php8.4
    user: "0:0"
    entrypoint: [wp, --allow-root, --path=/var/www/html]
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: local-fixture-only
      # wp-config.php obrazu czyta tę zmienną przy każdym uruchomieniu, więc cli też jej potrzebuje.
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
    volumes:
      - wordpress:/var/www/html
      - ..:/var/www/html/wp-content/plugins/digital-xperts-popup:ro
      - ../../menedzer-strony-ai:/var/www/html/wp-content/plugins/ai-site-manager:ro
      - .:/tests:ro
      - ../../menedzer-strony-ai/tests:/asm-tests:ro
volumes:
  wordpress:
